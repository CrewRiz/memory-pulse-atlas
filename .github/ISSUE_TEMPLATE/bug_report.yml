name: Bug report
description: Something the atlas drew or did that it should not have
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: "npx memory-pulse-atlas --version, or the commit"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node and operating system
      placeholder: "Node 24.11, macOS 26"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: The command you ran and its output. If a ledger is involved, a few fictional rows that show the problem; please do not paste private memories.
    validations:
      required: true
