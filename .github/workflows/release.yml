# A version tag (v1.2.3) on main releases that version.
# npm: staged through trusted publishing (OIDC, no stored token). Nothing is public on npm until a maintainer
# approves the staged version with two-factor authentication (npm stage approve, or Staged Packages on npmjs.com).
# Provenance is generated by trusted publishing from this public repository.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      on_npm: ${{ steps.meta.outputs.on_npm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - id: meta
        name: the tag, package.json and the changelog agree
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          v="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$v" ]; then echo "::error::tag $TAG but package.json says $v"; exit 1; fi
          if ! grep -q "^## \[$v\]" CHANGELOG.md; then echo "::error::CHANGELOG.md has no entry for $v"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if npm view "memory-pulse-atlas@$v" version >/dev/null 2>&1; then on_npm=true; else on_npm=false; fi
          echo "on_npm=$on_npm" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm test

  npm:
    needs: verify
    if: needs.verify.outputs.on_npm == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@12.2.3
      - run: npm ci --ignore-scripts
      - run: npm stage publish
      - env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: echo "::notice::memory-pulse-atlas $VERSION is staged on npm. It goes public when a maintainer approves it with 2FA (npm stage list memory-pulse-atlas, then npm stage approve <id>)."

  github:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: release notes from the changelog
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: awk -v v="$VERSION" '/^## \[/{on = index($0, "[" v "]") > 0; next} on' CHANGELOG.md > notes.md
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
