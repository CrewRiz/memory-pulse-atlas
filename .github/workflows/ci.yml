name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24, 26]
        include:
          - os: macos-latest
            node: 26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  browser:
    name: browser (the page draws and throws nothing, 1280 and 390 wide)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run probe
      - name: probe at device pixel ratio 2 (phones and laptop screens)
        run: npm run probe
        env:
          PROBE_DPR: "2"

  package:
    name: package (install the tarball in an empty project and build a page)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: pack, install, run
        run: |
          set -euo pipefail
          tgz="$PWD/$(npm pack --ignore-scripts --silent)"
          app="$(mktemp -d)"
          cd "$app"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$tgz"
          mkdir .memory-pulse
          printf '%s\n' '{"t":1,"cause":"refund window","effect":"30 days"}' \
            '{"t":2,"cause":"refund window","effect":"14 days","kind":"correction","withdrawn":["30 days"],"replacement":["14 days"]}' \
            '{"t":3,"cause":"support hours","effect":"9 to 5, refund window 30 days"}' > .memory-pulse/events.jsonl
          npx --no-install memory-pulse-atlas --strict | tee out.txt
          grep -q "3 memories, 1 topics, 1 corrections, 2 rows still carrying a withdrawn value" out.txt
          test "$(wc -c < memory-atlas.html)" -gt 500000
